# CI on every push/PR: lint, tests, repo hygiene, Docker build + container smoke test.
# CD on main/tags: the same tested image is pushed to GitHub Container Registry (GHCR).
name: CI/CD

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - run: ruff check src server serverv2 tests scripts --output-format=github

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-*.txt
      - run: pip install -r requirements-dev.txt
      - name: Unit + gateway tests (fake model, no GPU)
        run: pytest -p no:logging

  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No weights, .env files, secrets or huge files
        run: bash scripts/check_repo_hygiene.sh

  docker:
    needs: [lint, test, hygiene]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Image name (GHCR needs lowercase)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}-gateway" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: gateway:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Container smoke test (/health and /graph)
        run: |
          docker run -d --name gw -p 8100:8100 gateway:test
          for i in $(seq 1 30); do curl -sf localhost:8100/health && break; sleep 1; done
          curl -sf localhost:8100/health | grep -q '"ok"'
          curl -sf localhost:8100/graph | grep -q general_chat
          echo "Gateway container is healthy"
      - if: failure()
        run: docker logs gw

      - name: Push to GHCR (main / tags only)
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
